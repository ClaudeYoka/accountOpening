<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Test Fetch Account - Formulaire d'Ouverture de Compte</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-search {
            background: #667eea;
            color: white;
        }
        .btn-search:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-search:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }
        .btn-clear:hover {
            background: #e0e0e0;
        }
        .status-message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
        }
        .status-message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }
        .status-message.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #ef5350;
        }
        .status-message.info {
            background: #e3f2fd;
            color: #1565c0;
            border-left: 4px solid #42a5f5;
        }
        .result-box {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }
        .result-box.show {
            display: block;
        }
        .result-box h3 {
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ddd;
        }
        .result-item {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-label {
            font-weight: 600;
            color: #667eea;
            min-width: 180px;
        }
        .result-value {
            color: #333;
            word-break: break-all;
        }
        .result-value.empty {
            color: #999;
            font-style: italic;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.ok {
            background: #4caf50;
            color: white;
        }
        .status-badge.empty {
            background: #ff9800;
            color: white;
        }
        .debug-logs {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            margin-top: 20px;
        }
        .debug-logs.show {
            display: block;
        }
        .log-line {
            padding: 4px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .log-error {
            color: #f48771;
        }
        .log-success {
            color: #7ec699;
        }
        .log-info {
            color: #6a9fb5;
        }
        .toggle-debug {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background: #f0f0f0;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            color: #666;
        }
        .toggle-debug:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 Test API Fetch Account</h1>
    <p class="subtitle">Testez la récupération des données du compte depuis Oracle</p>

    <div class="form-group">
        <label for="accountNumber">Numéro de Compte:</label>
        <input type="text" id="accountNumber" placeholder="Ex: 2100067842" value="">
    </div>

    <div class="button-group">
        <button class="btn-search" id="btnSearch" onclick="searchAccount()">🔍 Chercher</button>
        <button class="btn-clear" id="btnClear" onclick="clearResults()">✕ Effacer</button>
    </div>

    <div id="statusMessage" class="status-message"></div>

    <div id="resultBox" class="result-box">
        <h3>📊 Résultats</h3>
        <div id="resultContent"></div>
    </div>

    <button class="toggle-debug" onclick="toggleDebugLogs()">📋 Afficher les logs</button>
    <div id="debugLogs" class="debug-logs"></div>
</div>

<script>
const logs = [];

function log(message, type = 'info') {
    const timestamp = new Date().toLocaleTimeString();
    logs.push({ message, type, timestamp });
    updateDebugDisplay();
    console.log(`[${timestamp}] ${message}`);
}

function updateDebugDisplay() {
    const debugBox = document.getElementById('debugLogs');
    debugBox.innerHTML = logs.map(log => {
        const classes = `log-line log-${log.type}`;
        return `<div class="${classes}">[${log.timestamp}] ${escapeHtml(log.message)}</div>`;
    }).join('');
}

function toggleDebugLogs() {
    document.getElementById('debugLogs').classList.toggle('show');
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showStatus(message, type) {
    const el = document.getElementById('statusMessage');
    el.textContent = message;
    el.className = `status-message ${type}`;
    el.style.display = 'block';
}

function searchAccount() {
    const accountNumber = document.getElementById('accountNumber').value.trim();
    
    if (!accountNumber) {
        showStatus('❌ Veuillez entrer un numéro de compte', 'error');
        return;
    }
    
    logs.length = 0;
    log('✓ Début de la recherche pour le compte: ' + accountNumber, 'info');
    
    const resultBox = document.getElementById('resultBox');
    resultBox.classList.add('show');
    resultBox.querySelector('h3').textContent = '⏳ Chargement...';
    
    const btnSearch = document.getElementById('btnSearch');
    btnSearch.disabled = true;
    const origText = btnSearch.textContent;
    btnSearch.textContent = '⏳ En cours...';
    
    showStatus('Recherche en cours...', 'info');
    
    // Appel à l'API
    fetch('fetch_account_flexcube.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'account=' + encodeURIComponent(accountNumber)
    })
    .then(resp => {
        log(`Status HTTP: ${resp.status}`, 'info');
        
        return resp.text().then(text => {
            log(`Réponse brute reçue (${text.length} caractères)`, 'info');
            
            try {
                const json = JSON.parse(text);
                log('JSON parsé avec succès', 'success');
                return { status: resp.status, json };
            } catch (e) {
                log(`ERREUR: Impossible de parser JSON: ${e.message}`, 'error');
                log(`Texte reçu: ${text.substring(0, 200)}...`, 'error');
                throw new Error('Réponse invalide du serveur');
            }
        });
    })
    .then(result => {
        const { status, json } = result;
        
        if (status === 200 && json.success) {
            log('✓ Réponse réussie (success: true)', 'success');
            displayResults(json.data);
            showStatus('✓ Compte trouvé avec succès!', 'success');
        } else {
            log(`✗ Erreur API: ${json.error || 'Inconnu'}`, 'error');
            showStatus(`❌ ${json.error || 'Compte non trouvé'}`, 'error');
        }
    })
    .catch(err => {
        log(`Erreur réseau/parsing: ${err.message}`, 'error');
        showStatus(`❌ Erreur: ${err.message}`, 'error');
    })
    .finally(() => {
        btnSearch.disabled = false;
        btnSearch.textContent = origText;
    });
}

function displayResults(data) {
    const html = `
        <div class="result-item">
            <span class="result-label">Numéro de Compte:</span>
            <span class="result-value">${data.account_number || '<span class="empty">Non disponible</span>'}</span>
        </div>
        <div class="result-item">
            <span class="result-label">ID Client:</span>
            <span class="result-value">${data.customer_id || '<span class="empty">Non disponible</span>'}</span>
        </div>
        <div class="result-item">
            <span class="result-label">Prénom(s):</span>
            <span class="result-value">${data['first-name'] ? data['first-name'] + ' <span class="status-badge ok">OK</span>' : '<span class="empty">Non disponible</span>'}</span>
        </div>
        <div class="result-item">
            <span class="result-label">Prénom Moyen:</span>
            <span class="result-value">${data.middle_name ? data.middle_name + ' <span class="status-badge ok">OK</span>' : '<span class="empty">Non disponible</span>'}</span>
        </div>
        <div class="result-item">
            <span class="result-label">Nom:</span>
            <span class="result-value">${data.last_name ? data.last_name + ' <span class="status-badge ok">OK</span>' : '<span class="empty">Non disponible</span>'}</span>
        </div>
        <div class="result-item">
            <span class="result-label">Téléphone:</span>
            <span class="result-value">${data.telephone ? data.telephone + ' <span class="status-badge ok">OK</span>' : '<span class="empty">Non disponible</span>'}</span>
        </div>
        <div class="result-item">
            <span class="result-label">Email:</span>
            <span class="result-value">${data.email ? data.email + ' <span class="status-badge ok">OK</span>' : '<span class="empty">Non disponible (normal)</span>'}</span>
        </div>
        <div class="result-item">
            <span class="result-label">Adresse:</span>
            <span class="result-value">${data.customer_address ? data.customer_address + ' <span class="status-badge ok">OK</span>' : '<span class="empty">Non disponible</span>'}</span>
        </div>
        <div class="result-item">
            <span class="result-label">Code Guichet:</span>
            <span class="result-value">${data.branch_code ? data.branch_code + ' <span class="status-badge ok">OK</span>' : '<span class="empty">Non disponible</span>'}</span>
        </div>
    `;
    
    const resultBox = document.getElementById('resultBox');
    resultBox.querySelector('h3').textContent = '✓ Résultats';
    document.getElementById('resultContent').innerHTML = html;
    
    log('Résultats affichés avec succès', 'success');
}

function clearResults() {
    document.getElementById('accountNumber').value = '';
    document.getElementById('resultBox').classList.remove('show');
    document.getElementById('statusMessage').style.display = 'none';
    logs.length = 0;
    updateDebugDisplay();
    document.getElementById('debugLogs').classList.remove('show');
}

// Auto-test si paramètre en URL
const params = new URLSearchParams(window.location.search);
if (params.has('account')) {
    document.getElementById('accountNumber').value = params.get('account');
    setTimeout(searchAccount, 500);
}
</script>
</body>
</html>
