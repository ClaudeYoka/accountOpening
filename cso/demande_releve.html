<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demande de relevé — Ecobank</title>
  <link rel="icon" sizes="180x180" href="../vendors/images/ecobank-bg.png">
	<link rel="icon" type="image/png" sizes="32x32" href="../vendors/images/ecobank-bg.png">
	<link rel="icon" type="image/png" sizes="16x16" href="../vendors/images/ecobank-bg.png">
<style>
  :root{
    --ink:#1a1a1a;
    --line:#222;
    --dot:#999;
    --accent:#003b5c;
    --accent2:#e8a33d;
    --paper:#ffffff;
    --muted:#444;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:#e9e9e9;
    font-family: Arial, Helvetica, sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:32px 16px;
    font-size:13.5px;
  }

  .page{
    background:var(--paper);
    width:100%;
    max-width:850px;
    padding:36px 46px 46px;
    box-shadow:0 2px 14px rgba(0,0,0,0.18);
  }

  /* ---------- logo ---------- */
  .logo{
    display:flex;
    flex-direction:column;
    line-height:1.1;
    margin-bottom:8px;
  }
  .logo .mark{ display:flex; align-items:baseline; gap:3px; }
  .logo .mark .eco{ font-size:24px; font-weight:800; color:var(--accent); }
  .logo .mark .bank{ font-size:24px; font-weight:800; color:var(--accent2); }
  .logo .tagline{ font-size:9.5px; font-style:italic; color:var(--muted); margin-top:1px; }

  /* ---------- copy block ---------- */
  .copy{
    padding-top:6px;
  }

  .copy .stub-title{
    font-weight:700;
    text-decoration:underline;
    text-underline-offset:3px;
    font-size:13px;
    margin:2px 0 18px;
  }

  .copy h1{
    text-align:center;
    font-size:14.5px;
    font-weight:800;
    text-decoration:underline;
    text-underline-offset:4px;
    line-height:1.5;
    margin:4px 0 26px;
  }

  .field{
    margin-bottom:16px;
  }
  .field-line{
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
  }
  .field-line .lbl{
    font-weight:700;
    text-decoration:underline;
    text-underline-offset:3px;
    white-space:nowrap;
  }
  .field-line .dotted-input{
    flex:1 1 auto;
    min-width:0;
    border:none;
    border-bottom:1px dotted var(--dot);
    background:transparent;
    font-family:inherit;
    font-size:13.5px;
    outline:none;
    padding:1px 4px;
  }
  .field.inline{ display:flex; align-items:baseline; gap:6px; }
  .field.inline .dotted-input{ width:140px; }
  .field.block .dotted-input{ display:block; width:100%; margin-top:6px; }

  .loader-screen {
    position: fixed;
    inset: 0;
    background: rgba(10, 18, 24, 0.60);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }

  .loader-screen.hidden {
    display: none;
  }

  .loader-spinner {
    width: 64px;
    height: 64px;
    border: 5px solid rgba(255,255,255,0.3);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .montant-row{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .montant-row .lbl{
    font-weight:700;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .montant-row .amount{ font-weight:800; }
  .montant-row .calc-box{
    border:1px solid var(--line);
    min-width:150px;
    padding:5px 10px;
    text-align:center;
    font-weight:700;
  }

  .sig-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:16px;
  }
  .sig-row .lbl{
    font-weight:700;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .sig-row .visa{
    font-weight:800;
    text-decoration:underline;
    text-underline-offset:3px;
  }

  .tear-line{
    border:none;
    border-top:1px dashed #999;
    margin:18px 0 20px;
    position:relative;
  }

  .footer{
    margin-top:18px;
    border-top:1px solid #ccc;
    padding-top:8px;
    text-align:center;
    font-size:9px;
    color:var(--muted);
  }

  .action-buttons {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid #ddd;
  }

  .action-buttons button {
    padding: 10px 24px;
    font-size: 13.5px;
    font-weight: 600;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .action-buttons .btn-print {
    background-color: var(--accent);
    color: #fff;
  }

  .action-buttons .btn-print:hover {
    background-color: #002a42;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  .action-buttons .btn-back {
    background-color: #999;
    color: #fff;
  }

  .action-buttons .btn-back:hover {
    background-color: #777;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  @page{ size:A4; margin:0; }

  @media print{
    body{ background:#fff; padding:0; }
    .page{ box-shadow:none; max-width:none; padding:20px 34px; }
    .tear-line{ border-top:1px dashed #999; margin:18px 0 20px; }
    .action-buttons { display: none; }
  }

  @media (max-width:600px){
    .page{ padding:24px 20px; }
    .montant-row{ flex-direction:column; align-items:flex-start; }
    .sig-row{ flex-direction:column; gap:12px; }
  }
</style>
</head>
<body>
<div class="loader-screen" id="data-loader" aria-live="polite" aria-label="Chargement des informations du compte">
  <div class="loader-spinner"></div>
</div>

<div class="page">

  <!-- ===================== Copie 1 : client ===================== -->
  <div class="copy">
    <div class="logo">
      <img src="../vendors/images/ecobank2.png" alt="" class="" width="140px">
    </div>

    <h1>DEMANDE DE RELEVÉ SUPÉRIEUR À UN (01) MOIS<br>SUR SUPPORT PAPIER</h1>

    <form>
      <div class="field inline">
        <span class="lbl">DATE</span> :
        <input class="dotted-input" type="text" data-field="date" readonly style="width:110px;">
      </div>

      <div class="field field-line">
        <span class="lbl">INTITULE DU COMPTE</span> :
        <input class="dotted-input" type="text" data-field="account-title">
      </div>

      <div class="field field-line">
        <span class="lbl">NUMERO DE COMPTE</span> :
        <input class="dotted-input" type="text" data-field="account-number" readonly>
      </div>

      <div class="field field-line">
        <span class="lbl">PERIODE</span> :
        <input class="dotted-input" type="text" data-field="period" readonly>
      </div>

      <div class="montant-row">
        <div><span class="lbl">MONTANT DES FRAIS</span> : <span class="amount">2.000 FCFA HT/MOIS TOTAL</span></div>
        <div class="calc-box" data-role="amount-calc">=</div>
      </div>

      <div class="sig-row">
        <div><span class="lbl">SIGNATURE DU CLIENT</span> :</div>
        <div class="visa">VISA CHEF D'AGENCE</div>
      </div>
      
      <br>
      <br>

    </form>
  </div>

  <!-- <hr class="tear-line"> -->

  <div class="action-buttons">
    <button type="button" class="btn-print" onclick="window.print()">Imprimer</button>
    <button type="button" class="btn-back" onclick="window.history.back()">Retour</button>
  </div>

</div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const account = (params.get('account') || '').trim();
  const period = (params.get('period') || '').trim();
  const months = parseInt(params.get('months') || '1', 10) || 1;
  const total = parseInt(params.get('total') || String(months * 2000), 10) || 0;

  function formatMoney(value) {
    return new Intl.NumberFormat('fr-FR').format(value) + ' FCFA';
  }

  function setValue(selector, value) {
    document.querySelectorAll(selector).forEach(function (element) {
      element.value = value || '';
    });
  }

  function setText(selector, value) {
    document.querySelectorAll(selector).forEach(function (element) {
      element.textContent = value || '';
    });
  }

  const now = new Date();
  const dateText = String(now.getDate()).padStart(2, '0') + '/' + String(now.getMonth() + 1).padStart(2, '0') + '/' + now.getFullYear();
  const loader = document.getElementById('data-loader');

  function hideLoader() {
    if (loader) {
      loader.classList.add('hidden');
    }
  }

  function isAccountTitleReady() {
    const titleElement = document.querySelector('[data-field="account-title"]');
    return !!(titleElement && titleElement.value && titleElement.value.trim().length > 0);
  }

  setValue('[data-field="date"]', dateText);
  setValue('[data-field="period"]', period);
  setText('[data-role="amount-calc"]', '2 000 × ' + months + ' = ' + formatMoney(total));

  if (account) {
    setValue('[data-field="account-number"]', account);
    setValue('[data-field="account-title"]', '');
  }

  function applyAccountData(data) {
    const title = data.account_title || data.account_name || data.customer_name || 'Compte ' + account;
    const number = data.account_number || account || '';
    setValue('[data-field="account-title"]', title);
    setValue('[data-field="account-number"]', number);
    if (isAccountTitleReady()) {
      hideLoader();
    }
  }

  if (account) {
    fetch('fetch_account_flexcube.php?account=' + encodeURIComponent(account), {
      headers: { 'Accept': 'application/json' }
    })
      .then(function (response) {
        if (!response.ok) {
          throw new Error('Compte non trouvé');
        }
        return response.json();
      })
      .then(function (json) {
        if (json && json.success && json.data) {
          applyAccountData(json.data);
        } else {
          setValue('[data-field="account-number"]', account);
          setValue('[data-field="account-title"]', 'Compte ' + account);
          hideLoader();
        }
      })
      .catch(function () {
        setValue('[data-field="account-number"]', account);
        setValue('[data-field="account-title"]', 'Compte ' + account);
        hideLoader();
      });
  } else {
    hideLoader();
  }

  setTimeout(function () {
    if (!isAccountTitleReady()) {
      const fallbackTitle = document.querySelector('[data-field="account-title"]');
      if (fallbackTitle) {
        fallbackTitle.value = 'Compte ' + (account || '');
      }
      hideLoader();
    }
  }, 2500);
})();
</script>

<script src="../vendors/js/today_form_dates.js"></script>
</body>
</html>
